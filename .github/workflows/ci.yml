name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch cancels the older, unfinished run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version is consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/check_version.sh

  python:
    name: Python app (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Shiny_app/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Shiny_app/python/requirements*.txt
      - run: pip install -r requirements-dev.txt ruff
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q

  r:
    name: R app (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Shiny_app/R
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2

      # Test exactly the package versions recorded in renv.lock
      - name: R version from renv.lock
        id: rver
        run: echo "version=$(jq -r .R.Version renv.lock)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rver.outputs.version }}
          use-public-rspm: true

      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev \
            libpng-dev libtiff-dev libjpeg-dev

      - name: Cache R packages
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-${{ steps.rver.outputs.version }}-${{ hashFiles('Shiny_app/R/renv.lock') }}

      - name: Restore the locked package versions
        run: |
          # Linux binaries from Posit Package Manager instead of source builds
          codename="$(lsb_release -cs)"
          export RENV_CONFIG_REPOS_OVERRIDE="https://packagemanager.posit.co/cran/__linux__/${codename}/latest"
          Rscript -e 'if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv")' \
                  -e 'renv::restore(lockfile = "renv.lock", library = .libPaths()[1], prompt = FALSE)' \
                  -e 'if (!requireNamespace("lintr", quietly = TRUE)) install.packages("lintr")'

      - name: Lint
        run: |
          lints <- lintr::lint_dir(".")
          print(lints)
          if (length(lints) > 0) quit(status = 1)
        shell: Rscript {0}

      - name: Test
        run: Rscript tests/testthat.R
