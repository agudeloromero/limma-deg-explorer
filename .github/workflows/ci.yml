name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  version:
    name: Version is consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/check_version.sh

  python:
    name: Python app (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Shiny_app/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Shiny_app/python/requirements*.txt
      - run: pip install -r requirements-dev.txt ruff
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q

  r:
    name: R app (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Shiny_app/R
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: Shiny_app/R
          packages: |
            any::shiny
            any::DT
            any::ggplot2
            any::ggrepel
            any::rmarkdown
            any::knitr
            any::openxlsx
            any::zip
            any::rlang
            any::testthat
            any::withr
            any::lintr
            bioc::clusterProfiler
            bioc::org.Mm.eg.db
      - name: Lint
        run: |
          lints <- lintr::lint_dir(".")
          print(lints)
          if (length(lints) > 0) quit(status = 1)
        shell: Rscript {0}
      - name: Test
        run: Rscript tests/testthat.R
